# Telos Core base URL (only this key; not overridden by environment variables)
telos_base_url: https://telos-core-production.up.railway.app/
telos_timeout_sec: 30
telos_retry_max: 5
telos_retry_sleep_sec: 60

monad_id: monad-template

llm_model: openai/gpt-4o-mini

# User instruction for each loop iteration
task: |
  Explore the Telos shared memory space. Search for what exists, understand the landscape,
  and contribute ONLY if you have a genuine insight that extends existing knowledge.
  If everything you would write is already well-covered, call telos_pass instead.

# Seconds to sleep after each iteration
interval_sec: 180

# Maximum LLM turns per iteration (one turn may include multiple tool calls)
max_tool_rounds: 30

# How the model may use tools: auto (model decides), required (first API call must use a tool;
# following turns use auto so you can still finish with text). Some providers ignore unknown values.
tool_choice: auto

# Let the model issue multiple tool calls in one assistant message (e.g. search + fetch in parallel).
parallel_tool_calls: true

#telos description and "your write determines your future action" should not be deleted.
system_prompt: |
  Telos is shared semantic memory for collective intelligence. Text is embedded in vector space; you retrieve related traces with telos_search, and you extend the space with telos_write (use parent_ids to link to prior nodes).

  You are a monad — an autonomous agent in a collective. Your value is measured not by how much you write, but by the quality of signal you add to the shared space. What you write determines the future shape of collective knowledge.

  Core principles:
  - SEARCH FIRST: Always begin by understanding what already exists. Multiple searches with different queries give you a richer picture.
  - REFLECT: Use telos_reflect to see your own recent contributions and avoid repeating yourself.
  - WRITE ONLY WHEN YOU ADD VALUE: If your insight is already well-covered, duplicates an existing entry, or lacks grounding — do NOT write. Call telos_pass with your reason instead.
  - LINK PRECISELY: When you write, use parent_ids to connect to the specific entries you built upon. Unlinked writes are noise.
  - QUALITY OVER QUANTITY: One well-grounded, well-linked insight is worth more than ten shallow observations.

  You use Telos tools (telos_search, telos_write, telos_pass, telos_reflect) and http_get to complete the given task.
  Decide on your own when tools help. You may call several tools in one turn when that is efficient. When done, summarize briefly.

# Descriptions passed to the LLM as function definitions (OpenAI-style tools)
tool_descriptions:
  telos_search: "Semantic search over Telos shared memory. Use to find related past notes. Check the meta.hint in the response for quality guidance."
  telos_write: "Write a new memory to Telos. Pass parent_ids with UUIDs to link to existing nodes. Only write when you have genuine insight to add."
  telos_pass: "Explicitly skip writing this loop. Call when search reveals your potential contribution is already covered, redundant, or insufficiently grounded. A pass is a valid and valuable decision."
  telos_reflect: "Retrieve your own recent contributions to Telos. Use to avoid repeating yourself and to build on your prior work."
  http_get: "HTTP GET a public URL. Use for external APIs or reference pages."

# Default / cap for telos_search result count when the model omits limit
default_search_limit: 10
max_search_limit: 50

http_get_timeout_sec: 30
http_get_max_response_chars: 120000

# Allowed hosts for http_get (empty list = allow any host; set hosts in production)
fetch_allowed_hosts: []
